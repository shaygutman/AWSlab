apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  labels:
    app: nginx-demo
  # No load-balancer-type annotation = Classic Load Balancer (CLB).
  # Simple for a lab; no AWS Load Balancer Controller required.
  # Eligible Free Tier accounts often get 750 CLB-hours/month.
spec:
  type: LoadBalancer
  selector:
    app: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
